name: verify
# APS-5-13: GitHub Actions가 push/PR마다 동일 커밋에서 build/lint/test를 독립 재실행.
# submit_test(에이전트 제출 출력)는 1차, CI green이 2차(권위). done 게이트가 이 CI green을 역연동한다.
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
# APS-5-13(보안 SUG-5): 최소 권한 원칙 — 기본 토큰을 read-only로 제한.
# verify는 빌드/린트/테스트만 하므로 write 권한 불필요(공급망 공격 표면 축소).
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # APS-5-13(보안 SUG-5): actions를 가변 @v4 태그 대신 commit SHA로 핀(supply-chain 변조 방지).
      # 태그는 이동 가능하지만 SHA는 불변 — 트레일링 주석에 사람이 읽을 버전 표기(감사/업데이트 용).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        # APS-5-14: version 키 제거 — package.json packageManager(pnpm@10.30.3)에서 자동 해석.
        # version 명시 시 packageManager와 충돌(ERR_PNPM_BAD_PM_VERSION)하여 CI 실패함.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # CRITICAL: test DB 격리 (docs/ci-test-isolation.md — APS-2-7 사고 회고 준수).
      # TEST_DATABASE_URL은 반드시 Neon test branch (production 금지).
      - name: Setup test env
        run: |
          cat > .env.test <<EOF
          DATABASE_URL=${{ secrets.TEST_DATABASE_URL }}
          EOF
      - name: Build
        run: pnpm -r build
      - name: Lint
        run: pnpm --filter @ai-pm/mcp-server lint
      - name: Test
        run: pnpm --filter @ai-pm/mcp-server test
