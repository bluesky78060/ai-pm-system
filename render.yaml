databases:
  - name: ai-pm-db
    plan: free
    databaseName: ai_pm
    user: ai_pm_user

services:
  - type: web
    name: ai-pm-system
    runtime: docker
    branch: master
    plan: free
    healthCheckPath: /api/projects
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-pm-db
          property: connectionString
      - key: STATIC_PATH
        value: /app/packages/web-ui/dist
      - key: STRICT_SUBMIT_TEST_PROJECTS
        value: APS
